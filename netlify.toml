[build]
  command = "npm run build"
  publish = "out"

[[edge_functions]]
  path = "/api/personalize"
  function = "personalize"

[[edge_functions]]
  path = "/api/oil-data"
  function = "oil-data"

[[edge_functions]]
  path = "/api/spr-data"
  function = "spr-data"

[[edge_functions]]
  path = "/api/supply-routes"
  function = "supply-routes"

[[edge_functions]]
  path = "/api/geopolitical-risk"
  function = "geopolitical-risk"

[[edge_functions]]
  path = "/api/ai-copilot"
  function = "ai-copilot"

[[edge_functions]]
  path = "/api/scenarios"
  function = "scenarios"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
